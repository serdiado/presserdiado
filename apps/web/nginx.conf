server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: React Router istemci-taraflı yönlendirme yapıyor — bilinmeyen
  # her yol index.html'e düşmeli (yoksa /studio/:id gibi doğrudan URL'ler 404 verir).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Statik varlıklar (hash'li dosya adları) uzun süre önbelleklenebilir.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
